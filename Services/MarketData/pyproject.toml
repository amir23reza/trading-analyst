[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data"
version = "0.1.0"
description = "Market Data service: daily stock bars from Yahoo Finance, stored in MSSQL, published as signed webhook events"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pymssql>=2.3",
  "pydantic-settings>=2.2",
  "yfinance>=0.2.40",
  "tenacity>=8.2",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.21", "testcontainers[mssql]>=4.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs Docker (Testcontainers)"]

[tool.ruff]
line-length = 100
target-version = "py312"
